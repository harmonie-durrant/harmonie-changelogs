name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (Home Assistant ${{ matrix.ha }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The minimum version in hacs.json, and the latest release.
        ha: ["2026.11.0", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          HA_IMAGE: ghcr.io/home-assistant/home-assistant:${{ matrix.ha }}
          CHROME_PATH: /usr/bin/google-chrome
          SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.ha }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
